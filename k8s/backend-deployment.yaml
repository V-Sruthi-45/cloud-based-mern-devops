apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: mern-devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: yourdockerhub/backend:latest

        ports:
        - containerPort: 5000