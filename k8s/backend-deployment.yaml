apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: mern-devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: taskflow-backend:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"

        - name: MONGODB_URI
          value: "YOUR_MONGODB_URI"

        - name: JWT_SECRET
          value: "your_super_secret_jwt_key_minimum_32_characters_long"

        - name: JWT_EXPIRES_IN
          value: "7d"

        - name: CORS_ORIGIN
          value: "http://frontend-service"