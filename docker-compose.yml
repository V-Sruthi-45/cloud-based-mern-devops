# =============================================================
# docker-compose.yml - Multi-Container Application Stack
# Services: frontend (React/Nginx) + backend (Node.js)
# Database: MongoDB Atlas (cloud - no local container needed)
# =============================================================

version: "3.9"

services:
  # ---- Backend API Service ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: taskflow-backend
    image: taskflow-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    env_file:
      - ./backend/.env
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Frontend Service ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000/api}
    container_name: taskflow-frontend
    image: taskflow-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskflow-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ---- Network ----
networks:
  taskflow-network:
    driver: bridge
    name: taskflow-network

# ---- Note ----
# MongoDB Atlas is a cloud service - no local container needed.
# Set MONGODB_URI in backend/.env to your Atlas connection string.
