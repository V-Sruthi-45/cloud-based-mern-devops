# =============================================================
# .github/workflows/ci-cd.yml
# CI/CD Pipeline: Lint → Build → Docker → Deploy Ready Check
# Triggers: Push to main/develop, Pull Requests to main
# =============================================================

name: CI/CD Pipeline - TaskFlow MERN App

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # JOB 1: Backend Validation & Build
  # ============================================================
  backend-ci:
    name: 🔧 Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        run: npm ci

      - name: 🔍 Validate package.json
        run: node -e "require('./package.json'); console.log('✅ package.json is valid')"

      - name: 🧪 Run Backend Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-pipeline
          MONGODB_URI: mongodb://localhost:27017/test_db

      - name: 🔒 Check for Security Vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: ✅ Backend Validation Complete
        run: echo "Backend CI passed successfully!"

  # ============================================================
  # JOB 2: Frontend Validation & Build
  # ============================================================
  frontend-ci:
    name: ⚛️ Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🔨 Build React Application
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:5000/api

      - name: 📊 Check Build Size
        run: |
          BUILD_SIZE=$(du -sh build | cut -f1)
          echo "📦 Build size: $BUILD_SIZE"
          ls -la build/

      - name: ✅ Frontend Validation Complete
        run: echo "Frontend CI passed successfully!"

  # ============================================================
  # JOB 3: Docker Build & Push (only on push to main)
  # ============================================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🏷️ Extract Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🔨 Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔨 Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}

      - name: ✅ Docker Build Complete
        run: |
          echo "======================================"
          echo "✅ CI/CD Pipeline Complete!"
          echo "======================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "======================================"

  # ============================================================
  # JOB 4: Deployment Readiness Summary
  # ============================================================
  deployment-summary:
    name: 📋 Deployment Summary
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: always()

    steps:
      - name: 📊 Generate Deployment Log
        run: |
          echo "======================================"
          echo "📋 TASKFLOW DEPLOYMENT SUMMARY"
          echo "======================================"
          echo "📅 Date: $(date -u)"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "🔢 Run Number: ${{ github.run_number }}"
          echo ""
          echo "📦 DEPLOYMENT TARGETS:"
          echo "  → AWS EC2: Deploy with docker-compose up -d"
          echo "  → Render: Connect GitHub repo"
          echo "  → Railway: railway up"
          echo ""
          echo "🔗 DOCKER IMAGES:"
          echo "  Backend:  ghcr.io/${{ github.repository }}/backend:latest"
          echo "  Frontend: ghcr.io/${{ github.repository }}/frontend:latest"
          echo "======================================"
